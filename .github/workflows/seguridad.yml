name: Seguridad - escaner de secretos
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  escaner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python seguridad/escaner_secretos.py .
